<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --ink: #20242a;
      --muted: #646b75;
      --paper: #f6f7f9;
      --surface: #ffffff;
      --wash: #f0f3f7;
      --line: #d9dee7;
      --accent: #245b8f;
      --accent-dark: #173f68;
      --warm: #9a5a22;
      --code-bg: #eef1f5;
    }

    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.7;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(246, 247, 249, 0.92) 260px),
        var(--paper);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 48px 24px 88px;
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(32, 36, 42, 0.06);
    }

    /* Typography */
    h1, h2, h3, h4 { color: var(--ink); line-height: 1.25; }
    h1 {
      font-family: 'IBM Plex Serif', Georgia, serif;
      font-size: 2.25rem;
      font-weight: 600;
      text-align: center;
      margin: 0 0 8px;
    }
    h2 {
      font-family: 'IBM Plex Serif', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 600;
      margin: 2.2em 0 0.8em;
      padding-bottom: 0.35em;
      border-bottom: 2px solid var(--line);
    }
    h3 { font-size: 1.12rem; font-weight: 700; margin: 1.6em 0 0.55em; }
    h4 { font-size: 1rem; margin: 1.2em 0 0.4em; }
    p { margin: 0.8em 0; }

    a { color: var(--accent); text-decoration: none; font-weight: 500; }
    a:hover { color: var(--accent-dark); text-decoration: underline; }

    /* Lists */
    ul, ol { padding-left: 1.8em; }
    li { margin: 0.3em 0; }

    /* Code */
    code {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.88em;
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
    }
    pre {
      background: #f4f7f4;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      line-height: 1.5;
    }
    pre code { background: none; padding: 0; font-size: 0.85em; }

    /* Tables */
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
      font-size: 0.92em;
      background: #fff;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 8px 12px;
      text-align: left;
    }
    th { background: var(--wash); font-weight: 600; }
    tr:nth-child(even) { background: #f7faf8; }

    /* Images & figures */
    img { max-width: 100%; height: auto; }
    figure { text-align: center; margin: 1.5em 0; }
    figcaption { font-size: 0.88em; color: var(--muted); margin-top: 8px; font-style: italic; }

    .page-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 24px 0 28px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--wash);
    }

    .page-nav a {
      min-width: 112px;
      padding: 8px 13px;
      border-radius: 6px;
      color: var(--accent-dark);
      text-align: center;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .page-nav a[aria-current="page"],
    .page-nav a:hover {
      background: #fff;
      text-decoration: none;
      box-shadow: inset 0 0 0 1px rgba(36, 91, 143, 0.22);
    }

    .link-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 24px 0 30px;
    }

    .link-strip a,
    .pending-link {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--accent-dark);
      font-size: 0.93rem;
      font-weight: 600;
    }

    .pending-link {
      color: var(--warm);
      background: #fff9f1;
      border-color: #ead5be;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 18px 0 26px;
    }

    .result-card {
      display: block;
      min-height: 116px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 10px 24px rgba(22, 32, 37, 0.05);
    }

    .result-card:hover {
      transform: translateY(-1px);
      text-decoration: none;
      box-shadow: 0 14px 30px rgba(22, 32, 37, 0.08);
    }

    .result-card span {
      display: block;
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .render-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin: 20px 0 24px;
    }

    .render-card {
      display: block;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 10px 24px rgba(22, 32, 37, 0.05);
    }

    .render-card:hover {
      transform: translateY(-1px);
      text-decoration: none;
      box-shadow: 0 14px 30px rgba(22, 32, 37, 0.08);
    }

    .render-card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #111;
      border-bottom: 1px solid var(--line);
    }

    .render-card-body {
      padding: 12px 14px 14px;
    }

    .render-card span {
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .render-card strong {
      display: block;
      color: var(--ink);
      font-size: 0.98rem;
      line-height: 1.25;
    }

    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      margin: 18px 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111;
      box-shadow: 0 14px 30px rgba(22, 32, 37, 0.08);
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .media-link {
      margin-top: 0;
      font-size: 0.94rem;
    }

    .media-placeholder {
      margin: 20px 0;
      padding: 18px;
      border: 1px dashed #b98b5e;
      border-radius: 8px;
      background: #fff9f1;
    }

    .media-placeholder strong {
      display: block;
      color: #7a3d16;
      font-size: 0.96rem;
    }

    .media-placeholder p {
      margin-bottom: 0;
      color: #6d5745;
      font-size: 0.94rem;
    }

    /* Image grid (used for side-by-side comparisons) */
    .image-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .image-grid table {
      width: 100%;
      text-align: center;
      border: none;
    }
    .image-grid td {
      text-align: center;
      border: none;
      padding: 8px;
    }
    .image-grid tr:nth-child(even) { background: none; }

    /* Responsive */
    @media (max-width: 600px) {
      .container { padding: 20px 16px 60px; }
      h1 { font-size: 1.55rem; }
      h2 { font-size: 1.2rem; }
      .page-nav { justify-content: stretch; }
      .page-nav a { flex: 1 1 100%; }
      .image-grid td { display: block; width: 100%; }
    }
  </style>

  <!-- MathJax 3 -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>
  <div class="container">
    {{ content }}
  </div>
</body>
</html>
